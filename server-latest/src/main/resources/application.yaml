spring:

  application:
    name: chatbot
  datasource:
    url: jdbc:mariadb://localhost:3300/chatbot
    username: root
    password: 1234
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    show-sql: true
server:
  port: 8080

feign:
  httpclient:
    enabled: true
  config:
    default:
      connectTimeout: 0
      readTimeout: 0
