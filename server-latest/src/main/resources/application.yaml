spring:

  application:
    name: chatbot
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    show-sql: true
server:
  port: 8080

feign:
  httpclient:
    enabled: true
  config:
    default:
      connectTimeout: 0
      readTimeout: 0

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL}